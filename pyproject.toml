[project]
name = "target-recall-hnsw"
version = "0.0.0"
description = "A from-scratch HNSW vector index with a self-tuning, recall-targeted ef_search controller."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Narek. T" }]
requires-python = ">=3.11"
keywords = ["hnsw", "vector-search", "ann", "nearest-neighbor", "embeddings", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/narektu/target-recall-hnsw"
Issues = "https://github.com/narektu/target-recall-hnsw/issues"

[project.optional-dependencies]
bench = ["matplotlib>=3.8", "hypothesis>=6.100"]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"